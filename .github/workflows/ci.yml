name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ModernPDF.slnx

      - name: Build
        run: dotnet build ModernPDF.slnx --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test --solution ModernPDF.slnx
          --configuration Release
          --no-build
          --
          --coverage
          --coverage-output-format cobertura
          --coverage-output coverage.cobertura.xml

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Add .NET tools to PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Generate coverage report
        run: >
          reportgenerator
          "-reports:**/TestResults/coverage.cobertura.xml"
          "-targetdir:artifacts/coverage"
          "-reporttypes:Html;Cobertura;MarkdownSummaryGithub"

      - name: Publish coverage summary
        run: cat artifacts/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: artifacts/coverage
          if-no-files-found: error

      - name: Upload raw coverage files
        uses: actions/upload-artifact@v4
        with:
          name: coverage-raw
          path: '**/TestResults/coverage.cobertura.xml'
          if-no-files-found: error
