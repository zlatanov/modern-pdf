name: Release NuGet

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark the GitHub release as prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set release variables
        id: vars
        run: |
          PACKAGE_ID="$(dotnet msbuild src/ModernPDF/ModernPDF.csproj -nologo -getProperty:PackageId | tr -d '\r\n')"
          VERSION="$(dotnet msbuild src/ModernPDF/ModernPDF.csproj -nologo -getProperty:Version | tr -d '\r\n')"
          if [ -z "$VERSION" ]; then
            echo "Package version is empty. Set <Version> in src/ModernPDF/ModernPDF.csproj."
            exit 1
          fi
          echo "package_id=$PACKAGE_ID" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure tag does not exist
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          if git show-ref --tags --verify --quiet "refs/tags/$TAG"; then
            echo "Tag $TAG already exists locally."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "Tag $TAG already exists on origin."
            exit 1
          fi

      - name: Ensure package version is not already on NuGet
        run: |
          PACKAGE_ID_LOWER="$(echo '${{ steps.vars.outputs.package_id }}' | tr '[:upper:]' '[:lower:]')"
          VERSION="${{ steps.vars.outputs.version }}"
          INDEX_URL="https://api.nuget.org/v3-flatcontainer/$PACKAGE_ID_LOWER/index.json"
          HTTP_STATUS="$(curl -sS -o nuget-index.json -w '%{http_code}' "$INDEX_URL")"
          if [ "$HTTP_STATUS" = "404" ]; then
            echo "No package history found for $PACKAGE_ID_LOWER on NuGet yet."
            exit 0
          fi
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Could not verify NuGet versions for $PACKAGE_ID_LOWER (HTTP $HTTP_STATUS)."
            exit 1
          fi
          VERSION="$VERSION" python - <<'PY'
import json
import os
import sys

version = os.environ["VERSION"].lower()
with open("nuget-index.json", "r", encoding="utf-8") as f:
    data = json.load(f)
versions = {v.lower() for v in data.get("versions", [])}
if version in versions:
    print(f"Version {os.environ['VERSION']} is already published on NuGet.")
    sys.exit(1)
print(f"Version {os.environ['VERSION']} is not published on NuGet.")
PY

      - name: Build
        run: dotnet build ModernPDF.slnx --configuration Release

      - name: Test
        run: dotnet test --solution ModernPDF.slnx --configuration Release --no-build

      - name: Pack
        run: >
          dotnet pack src/ModernPDF/ModernPDF.csproj
          --configuration Release
          --no-build
          --output ./artifacts/nupkg

      - name: Create and push git tag
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Publish to NuGet
        run: >
          dotnet nuget push ./artifacts/nupkg/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          files: artifacts/nupkg/*.nupkg
